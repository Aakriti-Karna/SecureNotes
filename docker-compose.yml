services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: securenotes
      POSTGRES_USER: securenotes
      POSTGRES_PASSWORD: securenotespass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securenotes -d securenotes"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
